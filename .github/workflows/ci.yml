name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout agtmux fixtures (sparse)
        run: scripts/dev/prepare-agtmux-fixtures.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run macOS CI parity checks
        run: scripts/dev/validate-macos-ci.sh
